AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PlaneLocket Symptom Relay - private two-user symptom log with OAuth-protected MCP tools

Parameters:
  OAuthCallbackUrl:
    Type: String
    Default: https://chatgpt.com
    Description: Exact callback URL displayed by the ChatGPT custom app editor.
  DashboardOrigin:
    Type: String
    Default: https://health.loopers.space
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
    Description: Exact private dashboard origin allowed by API CORS.
  DashboardCallbackUrls:
    Type: CommaDelimitedList
    Default: https://health.loopers.space/callback
    Description: Cognito callback URLs for the dashboard PKCE client.
  DashboardLogoutUrls:
    Type: CommaDelimitedList
    Default: https://health.loopers.space/
    Description: Cognito logout return URLs for the dashboard PKCE client.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 20
    MemorySize: 256
    Tracing: Active

Resources:
  ServerlessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref DashboardOrigin]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
  PaginationCursorSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encryption material for opaque, user-bound symptom pagination cursors
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  SymptomAttachmentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub planelocket-symptom-attachments-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins: [!Ref DashboardOrigin]
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUnconfirmedUploads
            Status: Enabled
            Prefix: pending/
            ExpirationInDays: 1

  SymptomAttachmentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SymptomAttachmentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SymptomAttachmentBucket.Arn
              - !Sub ${SymptomAttachmentBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  SymptomTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: planelocket-symptom-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SymptomUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: planelocket-symptom-mcp
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  SymptomResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref SymptomUserPool
      Identifier: planelocket-symptoms
      Name: PlaneLocket Symptom Log
      Scopes:
        - ScopeName: read
          ScopeDescription: Read the signed-in user's symptom records
        - ScopeName: write
          ScopeDescription: Create, update, and delete the signed-in user's symptom records

  SymptomOAuthClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: SymptomResourceServer
    Properties:
      UserPoolId: !Ref SymptomUserPool
      ClientName: chatgpt-planelocket-symptoms
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - planelocket-symptoms/read
        - planelocket-symptoms/write
      CallbackURLs: [!Ref OAuthCallbackUrl]
      SupportedIdentityProviders: [COGNITO]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SymptomDashboardOAuthClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: SymptomResourceServer
    Properties:
      UserPoolId: !Ref SymptomUserPool
      ClientName: planelocket-symptom-dashboard
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - planelocket-symptoms/read
        - planelocket-symptoms/write
      CallbackURLs: !Ref DashboardCallbackUrls
      LogoutURLs: !Ref DashboardLogoutUrls
      SupportedIdentityProviders: [COGNITO]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SymptomUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub planelocket-symptoms-${AWS::AccountId}
      UserPoolId: !Ref SymptomUserPool
      ManagedLoginVersion: 1

  SymptomRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: planelocket-symptom-relay
      CodeUri: src/symptom_relay/
      Handler: app.lambda_handler
      Description: OAuth-protected REST and MCP symptom tracker.
      Environment:
        Variables:
          TABLE_NAME: !Ref SymptomTable
          COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${SymptomUserPool}
          COGNITO_JWKS_URL: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${SymptomUserPool}/.well-known/jwks.json
          COGNITO_CLIENT_ID: !Ref SymptomOAuthClient
          COGNITO_DASHBOARD_CLIENT_ID: !Ref SymptomDashboardOAuthClient
          COGNITO_AUTHORIZATION_ENDPOINT: !Sub https://planelocket-symptoms-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize
          COGNITO_TOKEN_ENDPOINT: !Sub https://planelocket-symptoms-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
          ACTION_READ_SCOPE: planelocket-symptoms/read
          ACTION_WRITE_SCOPE: planelocket-symptoms/write
          DASHBOARD_ORIGIN: !Ref DashboardOrigin
          ATTACHMENT_BUCKET: !Ref SymptomAttachmentBucket
          ATTACHMENT_BUCKET_ORIGIN: !Sub https://${SymptomAttachmentBucket}.s3.${AWS::Region}.${AWS::URLSuffix}
          CURSOR_SECRET: !Sub '{{resolve:secretsmanager:${PaginationCursorSecret}:SecretString}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SymptomTable
        - S3CrudPolicy:
            BucketName: !Ref SymptomAttachmentBucket
      Events:
        OpenApi: {Type: HttpApi, Properties: {Path: /openapi.json, Method: GET}}
        Mcp: {Type: HttpApi, Properties: {Path: /mcp, Method: POST}}
        McpMetadata: {Type: HttpApi, Properties: {Path: /.well-known/oauth-protected-resource/mcp, Method: GET}}
        Health: {Type: HttpApi, Properties: {Path: /health, Method: GET}}
        EntriesGet: {Type: HttpApi, Properties: {Path: /entries, Method: GET}}
        EntriesPost: {Type: HttpApi, Properties: {Path: /entries, Method: POST}}
        EntriesOptions: {Type: HttpApi, Properties: {Path: /entries, Method: OPTIONS}}
        EntryPut: {Type: HttpApi, Properties: {Path: '/entries/{entry_id}', Method: PUT}}
        EntryDelete: {Type: HttpApi, Properties: {Path: '/entries/{entry_id}', Method: DELETE}}
        EntryAttachmentsGet: {Type: HttpApi, Properties: {Path: '/entries/{entry_id}/attachments', Method: GET}}
        EntryAttachmentGet: {Type: HttpApi, Properties: {Path: '/entries/{entry_id}/attachments/{attachment_id}', Method: GET}}
        EntryAttachmentStart: {Type: HttpApi, Properties: {Path: '/entries/{entry_id}/attachments/start', Method: POST}}
        EntryAttachmentComplete: {Type: HttpApi, Properties: {Path: '/entries/{entry_id}/attachments/{attachment_id}/complete', Method: POST}}
        EntryOptions: {Type: HttpApi, Properties: {Path: '/entries/{proxy+}', Method: OPTIONS}}
        ReportsSummary: {Type: HttpApi, Properties: {Path: /reports/summary, Method: GET}}
        ReportsTimeline: {Type: HttpApi, Properties: {Path: /reports/timeline, Method: GET}}
        ReportsSymptoms: {Type: HttpApi, Properties: {Path: /reports/symptoms, Method: GET}}
        ReportsCorrelations: {Type: HttpApi, Properties: {Path: /reports/correlations, Method: GET}}
        ReportsExport: {Type: HttpApi, Properties: {Path: /reports/export, Method: GET}}
        ReportsClinician: {Type: HttpApi, Properties: {Path: /reports/clinician-report, Method: GET}}
        ReportsOptions: {Type: HttpApi, Properties: {Path: '/reports/{proxy+}', Method: OPTIONS}}

Outputs:
  RelayApiUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  McpUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mcp
  ActionOpenApiUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/openapi.json
  OAuthAuthorizationEndpoint:
    Value: !Sub https://planelocket-symptoms-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize
  OAuthTokenEndpoint:
    Value: !Sub https://planelocket-symptoms-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
  OAuthClientId: {Value: !Ref SymptomOAuthClient}
  DashboardOAuthClientId: {Value: !Ref SymptomDashboardOAuthClient}
  DashboardOrigin: {Value: !Ref DashboardOrigin}
  OAuthScopes: {Value: 'openid email planelocket-symptoms/read planelocket-symptoms/write'}
  CognitoUserPoolId: {Value: !Ref SymptomUserPool}
  SymptomTableName: {Value: !Ref SymptomTable}
  SymptomAttachmentBucketName: {Value: !Ref SymptomAttachmentBucket}
  FunctionArn: {Value: !GetAtt SymptomRelayFunction.Arn}
