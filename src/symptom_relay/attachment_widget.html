<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
    body { margin: 0; padding: 14px; color: CanvasText; background: Canvas; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 14px; padding: 16px; }
    h2 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 5px 0 12px; color: color-mix(in srgb, CanvasText 72%, transparent); }
    input { display: block; width: 100%; margin: 12px 0; }
    button { border: 0; border-radius: 9px; padding: 9px 14px; font: inherit; font-weight: 650; color: white; background: #1769e0; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #status { min-height: 20px; margin-top: 10px; }
    .error { color: #c33; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Add a symptom attachment</h2>
    <p>Choose one JPEG, PNG, HEIC/HEIF, or PDF up to 20 MB.</p>
    <input id="file" type="file" accept="image/jpeg,image/png,image/heic,image/heif,application/pdf,.jpg,.jpeg,.png,.heic,.heif,.pdf">
    <button id="upload" type="button">Upload securely</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const fileInput = document.getElementById('file');
    const button = document.getElementById('upload');
    const status = document.getElementById('status');
    const MAX_BYTES = 20 * 1024 * 1024;

    function entryId() {
      return window.openai?.toolOutput?.entry_id || window.openai?.toolInput?.entry_id;
    }

    function setStatus(message, error = false) {
      status.textContent = message;
      status.className = error ? 'error' : '';
      window.openai?.notifyIntrinsicHeight?.();
    }

    button.addEventListener('click', async () => {
      const file = fileInput.files?.[0];
      if (!file) return setStatus('Choose a file first.', true);
      if (file.size > MAX_BYTES) return setStatus('That file is larger than 20 MB.', true);
      if (!entryId()) return setStatus('The symptom entry is missing. Ask ChatGPT to reopen the uploader for an entry.', true);
      if (!window.openai?.callTool) return setStatus('Uploads are not supported in this client.', true);

      button.disabled = true;
      setStatus('Preparing secure upload…');
      try {
        const started = await window.openai.callTool('start_attachment_upload', {
          entry_id: entryId(), filename: file.name, content_type: file.type, size_bytes: file.size
        });
        const upload = started?.structuredContent || started;
        if (!upload?.upload_url) throw new Error('Could not create an upload URL.');
        setStatus('Uploading…');
        const sent = await fetch(upload.upload_url, {
          method: 'PUT', body: file,
          headers: {'Content-Type': upload.content_type, 'x-amz-tagging': 'status=pending'}
        });
        if (!sent.ok) throw new Error(`Upload failed (${sent.status}).`);
        setStatus('Verifying…');
        const finished = await window.openai.callTool('complete_attachment_upload', {
          entry_id: entryId(), attachment_id: upload.attachment_id
        });
        const result = finished?.structuredContent || finished;
        if (!result?.attachment) throw new Error('The uploaded file could not be verified.');
        fileInput.value = '';
        setStatus(`Attached ${result.attachment.filename}.`);
        window.openai.sendFollowUpMessage?.({prompt: `The file ${result.attachment.filename} was attached successfully.`, scrollToBottom: false});
      } catch (error) {
        setStatus(error?.message || 'Upload failed.', true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
